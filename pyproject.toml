[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = [
    "unit: sans connexion PostgreSQL ni moteur IA réel",
    "qualification: moteur IA réel, option --allow-real-ai obligatoire",
    "integration: exige TEST_DATABASE_URL vers PostgreSQL local jetable",
    "browser: exige WEB_TEST_URL vers un serveur HTTPS de test et Chrome ou Edge installé",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.run]
branch = true
source = ["backend.app"]

[tool.coverage.report]
precision = 2

[tool.ruff.lint]
select = ["E", "F", "I"]
